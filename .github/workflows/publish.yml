name: Publish package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: 24
          cache: true
          run-install: true
          registry-url: https://registry.npmjs.org

      - name: Verify package
        run: vp run check && vp run test && vp run build

      - name: Publish to npm with OIDC trusted publishing
        run: npm publish --access public
